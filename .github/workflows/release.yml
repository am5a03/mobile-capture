name: Downloadable release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CAPTURE_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Set package paths
        run: |
          echo "CAPTURE_DEPENDENCY_CACHE=$RUNNER_TEMP/capture-dependencies" >> "$GITHUB_ENV"
          echo "CAPTURE_ARTIFACT_DIRECTORY=$RUNNER_TEMP/capture-package" >> "$GITHUB_ENV"
      - name: Validate tag and required signing configuration
        id: release
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CAPTURE_BUNDLE_IDENTIFIER: ${{ vars.CAPTURE_BUNDLE_IDENTIFIER }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: python3 -B Scripts/release-assets.py plan --event "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT" --check-signing
      - name: Run release fixture checks
        run: bash Scripts/test-all.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare reviewed dependency cache
        run: python3 -B Scripts/prepare-capture-cache.py --cache-root "$CAPTURE_DEPENDENCY_CACHE"
      - name: Prepare Apple signing and notarization
        if: steps.release.outputs.mode == 'release'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CAPTURE_BUNDLE_IDENTIFIER: ${{ vars.CAPTURE_BUNDLE_IDENTIFIER }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: bash Scripts/configure-release-signing.sh prepare
      - name: Build and verify complete app package
        env:
          CAPTURE_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_MODE: ${{ steps.release.outputs.mode }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CAPTURE_BUNDLE_IDENTIFIER: ${{ vars.CAPTURE_BUNDLE_IDENTIFIER }}
          NOTARY_PROFILE: mobile-capture-ci
          NOTARY_KEYCHAIN: ${{ runner.temp }}/mobile-capture-signing.keychain-db
        run: |
          if [[ "$RELEASE_MODE" == development ]]; then
            Scripts/release-mobile-capture.sh --development
          else
            Scripts/release-mobile-capture.sh
          fi
      - name: Stage release downloads
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_MODE: ${{ steps.release.outputs.mode }}
        run: |
          python3 -B Scripts/release-assets.py stage --package "$CAPTURE_ARTIFACT_DIRECTORY" \
            --output "$RUNNER_TEMP/release-assets" --version "$RELEASE_VERSION" --mode "$RELEASE_MODE"
      - name: Write setup and signing notes
        env:
          RELEASE_MODE: ${{ steps.release.outputs.mode }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Install and diagnose with an agent from the repository URL using [Agent Setup](https://github.com/am5a03/mobile-capture/blob/main/docs/AGENT_SETUP.md).

          Requires Apple Silicon and macOS 26+. The ZIP includes the capture engine, embedded Python and Android tools. Physical iPhone USB logging needs separate supported tools; Simulator capture needs Xcode. Phone certificate trust and VPN approval remain user steps. JSON Doctor reports Mac prerequisites, not phone readiness.
          NOTES
          if [[ "$RELEASE_MODE" == development ]]; then
            cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'

          **Development beta: ad-hoc signed and not notarized.** Install only if you trust this project and explicitly accept development builds. macOS can block execution; the installer reports a manual approval handoff and never bypasses Gatekeeper. This beta is for setup testing. Simulator Doctor can report an installed Xcode shell launcher as incompatible; the read-only check never runs first-launch setup. Fresh-Mac and full device acceptance remain outstanding.
          NOTES
          fi
      - name: Publish the release with its verified app and setup assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes --prerelease="$RELEASE_PRERELEASE"
      - name: Remove signing credentials
        if: always() && steps.release.outputs.mode == 'release'
        run: bash Scripts/configure-release-signing.sh cleanup
